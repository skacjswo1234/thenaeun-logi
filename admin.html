<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문의 관리 - 더나은물류</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="admin-container">
        <!-- 헤더 -->
        <header class="admin-header">
            <div class="header-content">
                <div class="header-left">
                    <img src="images/logo_white.png" alt="더나은물류" class="header-logo">
                    <h1>문의 관리</h1>
                </div>
                <div class="header-actions">
                    <button class="btn btn-secondary" id="changePasswordBtn">비밀번호 변경</button>
                    <button class="btn btn-refresh" id="refreshBtn">새로고침</button>
                    <button class="btn btn-logout" id="logoutBtn">로그아웃</button>
                    <div class="stats">
                        <span class="stat-item">
                            <span class="stat-label">전체:</span>
                            <span class="stat-value" id="totalCount">0</span>
                        </span>
                        <span class="stat-item">
                            <span class="stat-label">신규:</span>
                            <span class="stat-value stat-new" id="newCount">0</span>
                        </span>
                        <span class="stat-item">
                            <span class="stat-label">읽음:</span>
                            <span class="stat-value stat-read" id="readCount">0</span>
                        </span>
                        <span class="stat-item">
                            <span class="stat-label">답변완료:</span>
                            <span class="stat-value stat-replied" id="repliedCount">0</span>
                        </span>
                    </div>
                </div>
            </div>
        </header>

        <!-- 필터 및 검색 -->
        <div class="admin-filters">
            <div class="filter-group">
                <label for="statusFilter">상태 필터:</label>
                <select id="statusFilter" class="filter-select">
                    <option value="">전체</option>
                    <option value="new">신규</option>
                    <option value="read">읽음</option>
                    <option value="replied">답변완료</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="searchInput">검색:</label>
                <input type="text" id="searchInput" class="filter-input" placeholder="이름, 연락처, 내용 검색...">
            </div>
        </div>

        <!-- 로딩 표시 -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>로딩 중...</p>
        </div>

        <!-- 문의 목록 -->
        <div class="contacts-list" id="contactsList">
            <!-- 문의 항목들이 여기에 동적으로 추가됩니다 -->
        </div>

        <!-- 페이지네이션 -->
        <div class="pagination" id="pagination">
            <!-- 페이지네이션 버튼들이 여기에 동적으로 추가됩니다 -->
        </div>

        <!-- 문의 상세 모달 -->
        <div class="modal" id="contactModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>문의 상세</h2>
                    <button class="modal-close" id="closeModal">&times;</button>
                </div>
                <div class="modal-body" id="modalBody">
                    <!-- 문의 상세 정보가 여기에 표시됩니다 -->
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" id="closeModalBtn">닫기</button>
                    <button class="btn btn-primary" id="markAsReadBtn">읽음 처리</button>
                    <button class="btn btn-success" id="markAsRepliedBtn">답변완료</button>
                    <button class="btn btn-danger" id="deleteContactBtn">삭제</button>
                </div>
            </div>
        </div>

        <!-- 알림 메시지 -->
        <div class="toast" id="toast"></div>

        <!-- 비밀번호 변경 모달 -->
        <div class="modal" id="passwordModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>비밀번호 변경</h2>
                    <button class="modal-close" id="closePasswordModal">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="changePasswordForm">
                        <div class="form-group">
                            <label for="currentUsername">사용자명</label>
                            <input type="text" id="currentUsername" name="username" required readonly>
                        </div>
                        <div class="form-group">
                            <label for="oldPassword">현재 비밀번호</label>
                            <input type="password" id="oldPassword" name="oldPassword" required placeholder="현재 비밀번호를 입력하세요">
                        </div>
                        <div class="form-group">
                            <label for="newPassword">새 비밀번호</label>
                            <input type="password" id="newPassword" name="newPassword" required placeholder="새 비밀번호를 입력하세요 (최소 4자)" minlength="4">
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword">새 비밀번호 확인</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="새 비밀번호를 다시 입력하세요" minlength="4">
                        </div>
                        <div class="error-message" id="passwordError"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" id="cancelPasswordBtn">취소</button>
                    <button class="btn btn-primary" id="submitPasswordBtn">변경</button>
                </div>
            </div>
        </div>
    </div>

    <!-- API 설정 (Cloudflare Pages Functions 사용) -->
    <script>
        // Pages Functions는 같은 도메인에서 실행되므로 상대 경로 사용
        // 배포 후 Pages 도메인: https://your-site.pages.dev
        window.API_BASE_URL = '/api';
    </script>
    <script src="admin.js"></script>
</body>
</html>
