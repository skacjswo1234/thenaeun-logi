<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문의 관리 - 더나은물류</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="admin-wrapper">
        <!-- 왼쪽 사이드바 (데스크탑) -->
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="sidebar-header">
                <img src="images/logo_white.png" alt="더나은물류" class="sidebar-logo">
                <h2>관리자</h2>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-item active" data-page="contacts">
                    <span class="nav-icon">📋</span>
                    <span class="nav-text">문의 관리</span>
                </button>
                <button class="nav-item" data-page="settings">
                    <span class="nav-icon">⚙️</span>
                    <span class="nav-text">설정</span>
                </button>
            </nav>
            <div class="sidebar-footer">
                <button class="nav-item nav-item-danger" id="sidebarLogout">
                    <span class="nav-icon">🚪</span>
                    <span class="nav-text">로그아웃</span>
                </button>
            </div>
        </aside>

        <!-- 메인 콘텐츠 영역 -->
        <div class="admin-main">
            <!-- 헤더 -->
            <header class="admin-header">
                <div class="header-content">
                    <div class="header-left">
                        <h1 id="pageTitle">문의 관리</h1>
                    </div>
                    <div class="header-actions">
                        <button class="menu-toggle-btn" id="menuToggleBtn" aria-label="메뉴 열기">
                            <span></span>
                            <span></span>
                            <span></span>
                        </button>
                        <div class="stats">
                            <span class="stat-item">
                                <span class="stat-label">전체:</span>
                                <span class="stat-value" id="totalCount">0</span>
                            </span>
                            <span class="stat-item">
                                <span class="stat-label">신규:</span>
                                <span class="stat-value stat-new" id="newCount">0</span>
                            </span>
                            <span class="stat-item">
                                <span class="stat-label">읽음:</span>
                                <span class="stat-value stat-read" id="readCount">0</span>
                            </span>
                            <span class="stat-item">
                                <span class="stat-label">답변완료:</span>
                                <span class="stat-value stat-replied" id="repliedCount">0</span>
                            </span>
                        </div>
                    </div>
                </div>
            </header>

            <!-- 페이지 콘텐츠 -->
            <div class="admin-content">
                <!-- 문의 관리 페이지 -->
                <div class="page-content active" id="page-contacts">
                    <!-- 필터 및 검색 -->
                    <div class="admin-filters">
                        <div class="filter-group">
                            <label for="statusFilter">상태 필터:</label>
                            <select id="statusFilter" class="filter-select">
                                <option value="">전체</option>
                                <option value="new">신규</option>
                                <option value="read">읽음</option>
                                <option value="replied">답변완료</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="searchInput">검색:</label>
                            <input type="text" id="searchInput" class="filter-input" placeholder="이름, 연락처, 내용 검색...">
                        </div>
                    </div>

                    <!-- 로딩 표시 -->
                    <div class="loading" id="loading">
                        <div class="spinner"></div>
                        <p>로딩 중...</p>
                    </div>

                    <!-- 문의 목록 -->
                    <div class="contacts-list" id="contactsList">
                        <!-- 문의 항목들이 여기에 동적으로 추가됩니다 -->
                    </div>

                    <!-- 페이지네이션 -->
                    <div class="pagination" id="pagination">
                        <!-- 페이지네이션 버튼들이 여기에 동적으로 추가됩니다 -->
                    </div>
                </div>

                <!-- 설정 페이지 -->
                <div class="page-content" id="page-settings">
                    <div class="settings-page">
                        <h2>설정</h2>
                        <div class="settings-section">
                            <h3>비밀번호 변경</h3>
                            <button class="btn btn-primary" id="settingsChangePassword">비밀번호 변경</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 문의 상세 모달 -->
        <div class="modal" id="contactModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>문의 상세</h2>
                    <button class="modal-close" id="closeModal">&times;</button>
                </div>
                <div class="modal-body" id="modalBody">
                    <!-- 문의 상세 정보가 여기에 표시됩니다 -->
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" id="closeModalBtn">닫기</button>
                    <button class="btn btn-primary" id="markAsReadBtn">읽음 처리</button>
                    <button class="btn btn-success" id="markAsRepliedBtn">답변완료</button>
                    <button class="btn btn-danger" id="deleteContactBtn">삭제</button>
                </div>
            </div>
        </div>

        <!-- 알림 메시지 -->
        <div class="toast" id="toast"></div>

        <!-- 모바일 사이드 메뉴 -->
        <div class="side-menu-overlay" id="sideMenuOverlay"></div>
        <div class="side-menu" id="sideMenu">
            <div class="side-menu-header">
                <h2>메뉴</h2>
                <button class="side-menu-close" id="sideMenuClose">&times;</button>
            </div>
            <div class="side-menu-content">
                <button class="side-menu-item" data-page="contacts">
                    <span>📋</span>
                    <span>문의 관리</span>
                </button>
                <button class="side-menu-item" data-page="settings">
                    <span>⚙️</span>
                    <span>설정</span>
                </button>
                <button class="side-menu-item side-menu-item-danger" id="sideMenuLogout">
                    <span>🚪</span>
                    <span>로그아웃</span>
                </button>
            </div>
        </div>

    </div>

    <!-- 비밀번호 변경 모달 (admin-wrapper 밖으로 이동) -->
    <div class="modal" id="passwordModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>비밀번호 변경</h2>
                <button class="modal-close" id="closePasswordModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="changePasswordForm">
                    <div class="form-group">
                        <label for="currentUsername">사용자명</label>
                        <input type="text" id="currentUsername" name="username" required readonly>
                    </div>
                    <div class="form-group">
                        <label for="oldPassword">현재 비밀번호</label>
                        <input type="password" id="oldPassword" name="oldPassword" required placeholder="현재 비밀번호를 입력하세요">
                    </div>
                    <div class="form-group">
                        <label for="newPassword">새 비밀번호</label>
                        <input type="password" id="newPassword" name="newPassword" required placeholder="새 비밀번호를 입력하세요 (최소 4자)" minlength="4">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">새 비밀번호 확인</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="새 비밀번호를 다시 입력하세요" minlength="4">
                    </div>
                    <div class="error-message" id="passwordError"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelPasswordBtn">취소</button>
                <button class="btn btn-primary" id="submitPasswordBtn">변경</button>
            </div>
        </div>
    </div>

    <!-- API 설정 (Cloudflare Pages Functions 사용) -->
    <script>
        // Pages Functions는 같은 도메인에서 실행되므로 상대 경로 사용
        // 배포 후 Pages 도메인: https://your-site.pages.dev
        window.API_BASE_URL = '/api';
    </script>
    <script src="admin.js"></script>
</body>
</html>
